<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">MediStock logo</title>
  <desc id="description">A teal medical cross built from rounded inventory blocks beside the MediStock wordmark.</desc>
  <rect width="1200" height="320" fill="#ffffff"/>

  <g transform="translate(170 80)" aria-hidden="true">
    <!-- Separate rounded blocks make the cross feel like arranged stock units. -->
    <rect x="48" y="0" width="56" height="56" rx="16" fill="#08777B"/>
    <rect x="0" y="48" width="56" height="56" rx="16" fill="#08777B"/>
    <rect x="96" y="48" width="56" height="56" rx="16" fill="#22B9B5"/>
    <rect x="48" y="96" width="56" height="56" rx="16" fill="#0B9C9D"/>
    <rect x="48" y="48" width="56" height="56" rx="16" fill="#08777B"/>
    <!-- Three small mint bars suggest stacked, countable inventory. -->
    <rect x="64" y="63" width="24" height="6" rx="3" fill="#67D2AE"/>
    <rect x="64" y="73" width="24" height="6" rx="3" fill="#67D2AE"/>
    <rect x="64" y="83" width="24" height="6" rx="3" fill="#67D2AE"/>
  </g>

  <g font-family="Manrope, Poppins, 'Segoe UI', Arial, sans-serif" font-size="100" font-weight="650" letter-spacing="-4">
    <text x="365" y="213" fill="#17383D">Medi<tspan fill="#0B9C9D">Stock</tspan></text>
  </g>
</svg>
