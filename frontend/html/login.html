<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#E8F4F1">
    <title>MediStock | Welcome back</title>
    <link rel="icon" href="/assets/medistock-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/app-theme.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <main class="login-shell" aria-label="MediStock sign in">
        <section class="story-panel" aria-labelledby="story-title">
            <a class="brand" href="/" aria-label="MediStock home">
                <img src="/assets/medistock-mark.svg" alt="">
                <span>MediStock</span>
            </a>
            <div class="story-copy">
                <p class="eyebrow">Smart pharmacy management</p>
                <h1 id="story-title">Every batch, <span>every bill</span></h1>
                <p>Track stock and expiry dates, bill customers fast, and keep your pharmacy running smoothly.</p>
            </div>
            <div class="story-foot" aria-hidden="true">Inventory · Billing · Pharmacy care</div>
        </section>

        <section class="form-panel" aria-labelledby="login-title">
            <div class="login-card">
                <header class="login-heading">
                    <span class="lock-art" aria-hidden="true">
                        <svg viewBox="0 0 56 56" fill="none">
                            <path d="M17 24v-7a11 11 0 0 1 22 0v7" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="12" y="23" width="32" height="27" rx="8" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="43" cy="42" r="11" fill="var(--teal)" stroke="var(--mint)" stroke-width="1.5"/>
                            <path d="m38.5 42 3 3 6-7" stroke="var(--mint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <div>
                        <h2 id="login-title">Login Now!</h2>
                        <p>Please enter your credentials to login.</p>
                    </div>
                </header>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" aria-label="Email address" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
                            <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-options">
                        <button class="forgot-link" id="forgotPasswordLink" type="button">Forgot password?</button>
                    </div>
                    <button class="login-button" id="loginButton" type="submit">Login</button>
                    <p class="message" id="message" role="status" aria-live="polite" hidden></p>
                </form>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/api/client.js"></script>
    <script src="/js/login.js"></script>
    <script>
        (() => {
            const a = document.getElementById('forgotPasswordLink');
            const t = document.getElementById('toast');
            let timer;
            document.addEventListener('click', e => {
                if (e.target !== a && !a.contains(e.target)) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                t.textContent = 'Please contact your administrator to reset your password.';
                t.classList.add('show');
                clearTimeout(timer);
                timer = setTimeout(() => t.classList.remove('show'), 3600);
            }, true);
        })();
    </script>
</body>
</html>
