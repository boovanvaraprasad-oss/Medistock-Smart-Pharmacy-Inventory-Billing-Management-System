<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E8F4F1"><title>MediStock | Welcome back</title><link rel="icon" href="/assets/medistock-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--teal:#08777B;--teal-bright:#0B9C9D;--aqua:#22B9B5;--mint:#67D2AE;--ink:#17383D;--muted:#60777B;--line:#D6E5E8;--mist:#E8F4F1;--danger:#D65354;--white:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:5vh 4vw;background:var(--mist);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
.login-shell{width:min(1190px,100%);min-height:min(690px,90vh);display:grid;grid-template-columns:60% 40%;overflow:hidden;border:1.5px solid rgba(23,56,61,.72);border-radius:18px;background:#f1f7f8;box-shadow:0 14px 34px rgba(23,56,61,.16)}.story-panel{display:flex;flex-direction:column;justify-content:space-between;min-width:0;padding:32px 5.3%;background:#f1f7f8}.brand{display:inline-flex;width:max-content;max-width:100%;align-items:center;gap:12px;color:var(--ink);text-decoration:none}.brand img{display:block;width:30px;height:30px;object-fit:contain}.brand span{font:700 25px/1 Inter,system-ui,sans-serif;letter-spacing:-.045em}.story-copy{width:min(530px,100%);margin:auto 0;padding:34px 0}.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 20px;color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.eyebrow:before{content:"";width:23px;height:2px;border-radius:2px;background:var(--teal-bright)}.story-copy h1{margin:0;color:#263234;font:500 clamp(38px,4.2vw,50px)/1.12 Inter,system-ui,sans-serif;letter-spacing:-.055em}.story-copy h1 span{display:block;color:var(--teal-bright);font-weight:800}.story-copy>p{max-width:520px;margin:22px 0 0;color:#3D5052;font-size:14px;line-height:1.8}.story-foot{color:#718486;font-size:11px;letter-spacing:.02em}
.form-panel{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding:52px;background:var(--teal)}.form-panel:before{content:"";position:absolute;z-index:0;width:170px;height:170px;right:-6px;top:-1px;border-radius:0 0 0 100%;background:var(--ink)}.form-panel:after{content:"";position:absolute;z-index:0;width:160px;height:160px;left:-75px;bottom:-104px;border:1px solid rgba(103,210,174,.18);border-radius:50%;box-shadow:0 0 0 14px rgba(103,210,174,.08),0 0 0 28px rgba(103,210,174,.05)}.login-card{position:relative;z-index:1;width:min(360px,100%);color:#fff}.login-heading{display:flex;align-items:center;gap:16px;margin-bottom:28px}.lock-art{position:relative;flex:0 0 54px;width:54px;height:54px;color:#B8EBDD}.lock-art svg{width:54px;height:54px;display:block}.login-heading h2{margin:0;color:#fff;font:800 25px/1.1 Inter,system-ui,sans-serif;letter-spacing:-.035em}.login-heading p{margin:6px 0 0;color:#D4F0E8;font-size:11px;line-height:1.4}
.field{margin:0 0 17px}.field label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.field input{display:block;width:100%;height:48px;padding:0 19px;border:1px solid rgba(103,210,174,.32);border-radius:999px;background:#DDF2E9;color:var(--ink);font:500 13px 'Inter',sans-serif;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}.field input::placeholder{color:#718486}.field input:focus{border-color:var(--mint);background:#F1F8F5;box-shadow:0 0 0 4px rgba(103,210,174,.2)}.password-wrap{position:relative}.password-wrap input{padding-right:54px}.password-toggle{position:absolute;top:50%;right:10px;display:grid;width:32px;height:32px;transform:translateY(-50%);place-items:center;border:0;border-radius:50%;background:transparent;color:#557875;cursor:pointer}.password-toggle:hover{background:rgba(8,119,123,.1)}.password-toggle svg{width:18px;height:18px}.form-options{display:flex;justify-content:flex-end;margin:-1px 2px 26px}.forgot-link{padding:0;border:0;background:none;color:#D4F0E8;font:500 12px 'Inter',sans-serif;text-decoration:none;cursor:pointer}.forgot-link:hover{color:#fff;text-decoration:underline}.login-button{display:block;width:96px;height:40px;margin-left:auto;border:0;border-radius:999px;background:#fff;color:var(--ink);font:700 11px 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:background .18s,color .18s,transform .18s,box-shadow .18s}.login-button:hover{transform:translateY(-1px);background:var(--mint);color:var(--ink);box-shadow:0 8px 18px rgba(23,56,61,.2)}.login-button:disabled{opacity:.7;cursor:wait;transform:none}.login-button:focus-visible,.forgot-link:focus-visible,.password-toggle:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.message{margin:18px 0 0;padding:11px 14px;border:1px solid rgba(214,83,84,.38);border-radius:10px;background:#FFF1F1;color:#963D3D;font-size:13px;line-height:1.45}.message[hidden]{display:none}.toast{position:fixed;right:24px;bottom:24px;z-index:5;max-width:min(420px,calc(100vw - 32px));padding:14px 18px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:var(--ink);color:#fff;font-size:14px;line-height:1.5;box-shadow:0 14px 40px rgba(23,56,61,.24);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:760px){body{padding:20px}.login-shell{width:min(560px,100%);grid-template-columns:1fr;min-height:0}.story-panel{min-height:370px;padding:28px 32px}.story-copy{padding:48px 0}.story-copy h1{font-size:clamp(38px,9vw,50px)}.form-panel{min-height:410px;padding:44px 32px}.form-panel:before{width:125px;height:125px}}@media(max-width:420px){body{padding:10px}.login-shell{border-radius:14px}.story-panel{min-height:330px;padding:24px}.brand span{font-size:22px}.story-copy{padding:38px 0}.story-copy>p{font-size:13px}.form-panel{min-height:390px;padding:36px 24px}.login-heading h2{font-size:23px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head><body>
<main class="login-shell" aria-label="MediStock sign in">
<section class="story-panel" aria-labelledby="story-title"><a class="brand" href="/" aria-label="MediStock home"><img src="/assets/medistock-mark.svg" alt=""><span>MediStock</span></a><div class="story-copy"><p class="eyebrow">Smart pharmacy management</p><h1 id="story-title">Every batch,<span>every bill</span></h1><p>Track stock and expiry dates, bill customers fast, and keep your pharmacy running smoothly.</p></div><div class="story-foot" aria-hidden="true">Inventory · Billing · Pharmacy care</div></section>
<section class="form-panel" aria-labelledby="login-title"><div class="login-card"><header class="login-heading"><span class="lock-art" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none"><path d="M17 24v-7a11 11 0 0 1 22 0v7" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="23" width="32" height="27" rx="8" stroke="currentColor" stroke-width="1.5"/><circle cx="43" cy="42" r="11" fill="var(--teal)" stroke="var(--mint)" stroke-width="1.5"/><path d="m38.5 42 3 3 6-7" stroke="var(--mint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><h2 id="login-title">Login Now!</h2><p>Please enter your credentials to login.</p></div></header>
<form id="loginForm" novalidate><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" aria-label="Email address" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="form-options"><button class="forgot-link" id="forgotPasswordLink" type="button">Forgot password?</button></div><button class="login-button" id="loginButton" type="submit">Login</button><p class="message" id="message" role="status" aria-live="polite" hidden></p></form></div></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script src="/js/api/client.js"></script><script src="/js/login.js?v=20261110-role-home-v1"></script><script>(()=>{const a=document.getElementById('forgotPasswordLink'),t=document.getElementById('toast');let timer;document.addEventListener('click',e=>{if(e.target!==a&&!a.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation();t.textContent='Please contact your administrator to reset your password.';t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),3600)},true)})();</script>
</body></html>
