<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock Units</title>
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="css/confirm-dialog.css">
    <link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div>
                <p class="eyebrow">Master data</p>
                <h1>Units</h1>
                <p class="subtitle">Manage the units used for medicines.</p>
            </div>
        </header>

        <p id="errorMessage" class="message message-error" role="alert" hidden></p>
        <p id="successMessage" class="message message-success" role="status" hidden></p>
        <p id="statusMessage" class="message" role="status">Loading units…</p>

        <section id="formSection" class="panel" hidden>
            <h2 id="formTitle">Add unit</h2>
            <form id="unitForm" class="category-form">
                <label for="unitName">Unit name</label>
                <input id="unitName" type="text" minlength="1" maxlength="50" required>
                <div class="form-actions">
                    <button id="saveButton" class="button button-primary" type="submit">
                        Create unit
                    </button>
                    <button id="cancelButton" class="button button-secondary" type="button" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>Unit list</h2>
                    <p id="listDescription" class="helper-text">Loading…</p>
                </div>
                <button id="refreshButton" class="button button-secondary" type="button">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Unit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="unitRows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api/client.js"></script>
    <script src="js/components/confirm-dialog.js"></script>
    <script src="js/components/app-shell.js"></script>
    <script src="js/units.js"></script>
</body>
</html>
