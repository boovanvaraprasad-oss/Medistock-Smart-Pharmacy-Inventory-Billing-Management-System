<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock | Stock Batches</title>
    <link rel="icon" href="/assets/medistock-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/record-search.css">
    <link rel="stylesheet" href="/css/batches.css">
    <link rel="stylesheet" href="/css/app-theme.css">
    <script src="/js/components/theme-bootstrap.js"></script>
</head>
<body class="app-theme-ready">
    <main class="page batches-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">Inventory</p>
                <h1>Stock batches</h1>
                <p class="subtitle">Review batch quantities, purchase prices, and expiry dates.</p>
            </div>
        </header>

        <p id="statusMessage" class="status-message" role="status">Loading stock batches…</p>
        <p id="errorMessage" class="error-message" role="alert" hidden></p>

        <section id="batchContent" class="panel" hidden>
            <div class="section-heading">
                <div>
                    <h2>Batch inventory</h2>
                    <p class="helper-text"><strong id="batchCount">0</strong> batches · <strong id="unitCount">0</strong> units across active batches</p>
                </div>
                <button id="refreshButton" class="button button-secondary" type="button">Refresh</button>
            </div>

            <div class="record-search" role="search">
                <label for="batchSearch">Search batches</label>
                <input id="batchSearch" type="search" data-record-search="#batchRows" placeholder="Search medicine, batch, or status" autocomplete="off">
                <p class="record-search-empty" role="status" hidden>No matching batches.</p>
            </div>

            <p id="emptyMessage" class="status-message" role="status" hidden>No stock batches found.</p>
            <div class="batches-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Medicine</th>
                            <th>Batch</th>
                            <th>Remaining quantity</th>
                            <th>Purchase price</th>
                            <th>Manufactured</th>
                            <th>Expiry</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="batchRows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/api/client.js"></script>
    <script src="/js/components/app-shell.js"></script>
    <script src="/js/components/record-search.js"></script>
    <script src="/js/batches.js"></script>
</body>
</html>
