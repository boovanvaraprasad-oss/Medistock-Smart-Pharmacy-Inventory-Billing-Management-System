<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock Categories</title>
    <link rel="stylesheet" href="css/categories.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div>
                <p class="eyebrow">Master data</p>
                <h1>Categories</h1>
                <p class="subtitle">Organize medicines by category.</p>
            </div>
            <a class="button button-secondary" href="dashboard.html">Back to dashboard</a>
        </header>

        <p id="errorMessage" class="message message-error" role="alert" hidden></p>
        <p id="successMessage" class="message message-success" role="status" hidden></p>
        <p id="statusMessage" class="message" role="status">Loading categories…</p>

        <section id="categoryFormSection" class="panel" hidden>
            <h2 id="formTitle">Add category</h2>
            <form id="categoryForm" class="category-form">
                <label for="categoryName">Category name</label>
                <input
                    id="categoryName"
                    type="text"
                    minlength="2"
                    maxlength="100"
                    required
                >
                <div class="form-actions">
                    <button id="saveButton" class="button button-primary" type="submit">
                        Create category
                    </button>
                    <button id="cancelButton" class="button button-secondary" type="button" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>Category list</h2>
                    <p id="listDescription" class="helper-text">Loading…</p>
                </div>
                <button id="refreshButton" class="button button-secondary" type="button">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryRows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api/client.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
