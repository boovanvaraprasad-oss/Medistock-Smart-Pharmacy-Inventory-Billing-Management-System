<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/components/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="css/app-theme.css?v=20261109-pharmacy-palette-v3">
    <link rel="stylesheet" href="css/signup.css?v=20261109-pharmacy-palette-v1">
</head>
<body class="app-theme-ready signup-page">

    <main class="signup-card">
        <h1>MediStock</h1>
        <h2>Sign Up</h2>

        <form id="signupForm">
            <div>
                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    name="email"
                    placeholder="name@medistock.com"
                    required
                >
            </div>

            <div>
                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    required
                >
            </div>

            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                >
            </div>

            <button type="submit">Create Account</button>
        </form>

        <button type="button" id="backToLogin">Back to Login</button>

        <div id="message"></div>
    </main>

    <script src="js/api/client.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
